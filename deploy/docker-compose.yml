services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file:
      - ../.env.example
    volumes:
      - ../data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - redis
  worker:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    env_file:
      - ../.env.example
    volumes:
      - ../data:/app/data
    depends_on:
      - redis
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
